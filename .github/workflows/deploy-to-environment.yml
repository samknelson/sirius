name: Deploy to Environment

# ─────────────────────────────────────────────────────────────────────────────
# Reusable workflow: rolls the ui, api and ws ECS services — all sharing the
# same image — to ECS Fargate for one env.
#
# Topology: ONE container image per env, deployed to up to THREE ECS services in
# the same cluster. The image runs Express on PORT=5000 serving both /api/* and
# the built SPA from dist/public. All services run the identical image; which
# slice each one answers is selected at runtime by SERVICE_ROLE, set per service
# by Terraform (fm-workloads-fls):
#
#   service   SERVICE_ROLE   ALB rule                       health check
#   ui        static         priority 100  /*               /
#   api       api-user       priority  10  /api, /api/*     /api/health
#   ws        api-ws         priority   5  /api/ws, /api/ws/*   /api/ws/health
#
# ws is the gateway-facing web-service surface, reached through the Freeman API
# Gateway. A container answers 503 SERVICE_ROLE_NOT_ASSIGNED for anything
# outside its slice — including its own health check, which is why each service
# has a different health path.
#
# SERVICE_ROLE IS OWNED BY TERRAFORM, NOT BY THIS WORKFLOW. It reaches a task
# only because the describe below picks up the revision Terraform registered,
# and because SERVICE_ROLE is on KEEP_VARS so the env replace does not strip it.
# Hence apply-then-deploy, never the reverse.
#
# ws IS OPTIONAL. An environment where the three-service split has not been
# applied yet has no ws service, so the caller passes an empty ws-image-uri (or
# the ws service simply does not exist) and this workflow rolls ui and api only.
# Nothing needs editing here when ws is later applied.
#
# NOTE (2026-06-14): fm-workloads-fls switched to Mode B
# (`ignore_task_definition_changes = true`). This workflow IS the source of
# truth for task revisions; Terraform no longer overwrites them on apply.
#
# Pattern: Terraform (fm-workloads-fls) owns the task definition shape (env
# vars, secrets, roles, CPU/memory, logs, container port, health check). This
# workflow only registers a new revision per family pointed at the latest
# image and updates each service to use it.
#
# Rollout safety (both opt-in via inputs, so existing callers are unaffected):
#   rollback-on-failure        default false. On failure, every service that was
#                              actually switched is returned to the revision it
#                              was running before this run. The job still fails.
#   stability-timeout-minutes  default 10. Enforced by a polling waiter rather
#                              than `aws ecs wait services-stable`, which is
#                              hard-capped at 10 minutes with no CLI override.
#                              A rollout the deployment circuit breaker marks
#                              FAILED aborts immediately instead of waiting out
#                              the full deadline.
#
# Terraform-owned task definition is expected to provide:
#   env:           DATABASE_URL, SESSION_SECRET, PORT=5000, NODE_ENV=production,
#                  plus whichever auth-provider secrets the env uses
#   container:     port 5000
#   health check:  GET /health → {status: "ready"}
#
# NOTE (gap surfaced for next on-call, NOT a TODO for this workflow):
#   The app reads DATABASE_URL, SESSION_SECRET, CLERK_*, etc. at startup, and
#   runMigrations() runs before the server listens. The current Terraform task
#   definition only wires DB_HOST/DB_PORT/DB_NAME + DB_SECRET — DATABASE_URL is
#   not assembled, and the other required env vars are absent. Containers will
#   exit during runMigrations until task def shape is updated. Task def shape
#   is owned by Terraform; flagging here so the on-call has context.
#
# Required configuration:
#
#   Per-environment secrets (Settings → Environments → <name> → Secrets):
#     AWS_ROLE_ARN                  # OIDC role ARN
#     VITE_CLERK_PUBLISHABLE_KEY    # baked into the UI bundle at build time
#
#   Per-environment variables (Settings → Environments → <name> → Variables):
#     ECS_CLUSTER     # e.g. fm-fls-ecs-dev-use2  (note the -ecs- infix)
#     ENVIRONMENT_URL # (optional) Public URL shown in GH deployment view
#
# Hardcoded (no secrets needed):
#   AWS_REGION              = us-east-2 (short code: use2)
#   ECS UI service name     = fm-fls-ui-<env-short>-use2
#   ECS API service name    = fm-fls-api-<env-short>-use2
#   ECS WS service name     = fm-fls-ws-<env-short>-use2
#   UI task family          = fm-fls-ui-<env-short>-use2
#   API task family         = fm-fls-api-<env-short>-use2
#   WS task family          = fm-fls-ws-<env-short>-use2
#   (service name == task family name in this topology)
#
# Environment → short code mapping:
#   Development → dev
#   UAT         → uat
#   QA          → qa
#   Production  → prod
# (Dev, UAT and QA are wired up today; reusable workflow accepts any value via wildcard.)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target GitHub Environment name (Development, UAT, QA, Production)'
        required: true
        type: string
      ui-image-uri:
        description: 'Full ECR URI for the UI repo image (with tag)'
        required: true
        type: string
      api-image-uri:
        description: 'Full ECR URI for the API repo image (with tag)'
        required: true
        type: string
      ws-image-uri:
        description: 'Full ECR URI for the WS repo image (with tag). Leave empty in an environment where the ws service has not been applied yet; ws is then skipped.'
        required: false
        default: ''
        type: string
      rollback-on-failure:
        description: 'If the rollout fails, return each service that was updated to its previous task revision'
        required: false
        default: false
        type: boolean
      stability-timeout-minutes:
        description: 'Maximum minutes to wait for the services to reach a stable state'
        required: false
        default: 10
        type: number

env:
  AWS_REGION: us-east-2
  SHORT_REGION: use2
  PROJECT: fls

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.ENVIRONMENT_URL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Compute resource names
      id: names
      run: |
        set -euo pipefail
        ENV_LOWER=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
        case "$ENV_LOWER" in
          development) ENV_SHORT="dev" ;;
          production)  ENV_SHORT="prod" ;;
          *)           ENV_SHORT="$ENV_LOWER" ;;
        esac
        # Service name == task family name for each component.
        UI_SERVICE="fm-${{ env.PROJECT }}-ui-${ENV_SHORT}-${{ env.SHORT_REGION }}"
        API_SERVICE="fm-${{ env.PROJECT }}-api-${ENV_SHORT}-${{ env.SHORT_REGION }}"
        WS_SERVICE="fm-${{ env.PROJECT }}-ws-${ENV_SHORT}-${{ env.SHORT_REGION }}"
        echo "env-short=$ENV_SHORT" >> $GITHUB_OUTPUT
        echo "env-lower=$ENV_LOWER" >> $GITHUB_OUTPUT
        echo "ui-service=$UI_SERVICE" >> $GITHUB_OUTPUT
        echo "api-service=$API_SERVICE" >> $GITHUB_OUTPUT
        echo "ws-service=$WS_SERVICE" >> $GITHUB_OUTPUT

    - name: Build container env from GitHub Environment
      id: appenv
      # All app-bound config lives in GitHub (Settings -> Environments ->
      # <name> -> Variables / Secrets) with an APP_ prefix, e.g.
      # APP_AUTH_PROVIDER=saml becomes AUTH_PROVIDER=saml in the container.
      # The prefix separates app config from pipeline plumbing
      # (AWS_ROLE_ARN, ECS_CLUSTER, ENVIRONMENT_URL, VITE_CLERK_*, etc.).
      # Adding a new app variable later = add APP_<NAME> in the GitHub UI;
      # this workflow needs no edit.
      #
      # NOTE: secrets routed this way end up as plain values in the task
      # definition's `environment` block (visible to anyone who can
      # describe-task-definition, retained in old revisions). Accepted
      # tradeoff for now; the upgrade path is SSM/Secrets Manager + the
      # Terraform-owned `secrets` block.
      env:
        ALL_VARS: ${{ toJSON(vars) }}
        ALL_SECRETS: ${{ toJSON(secrets) }}
      run: |
        set -euo pipefail
        jq -n --argjson v "$ALL_VARS" --argjson s "$ALL_SECRETS" '
          ($v + $s)                     # secrets win a name collision
          | to_entries
          | map(select(.key | startswith("APP_")))
          | map({name: (.key | sub("^APP_"; "")), value: (.value | tostring)})
          | sort_by(.name)
        ' > app-env.json
        echo "App env var names: $(jq -r '[.[].name] | join(", ")' app-env.json)"

    - name: Capture current task revisions
      id: current
      # Recorded BEFORE anything is changed so the rollback step has somewhere
      # to return to. Read from the service (not the family) because the family's
      # latest revision may already be ahead of what is actually running.
      run: |
        set -euo pipefail
        CLUSTER="${{ vars.ECS_CLUSTER }}"
        UI_PREV=$(aws ecs describe-services --cluster "$CLUSTER" \
          --services "${{ steps.names.outputs.ui-service }}" \
          --query 'services[0].taskDefinition' --output text)
        API_PREV=$(aws ecs describe-services --cluster "$CLUSTER" \
          --services "${{ steps.names.outputs.api-service }}" \
          --query 'services[0].taskDefinition' --output text)
        echo "ui-prev-task-arn=$UI_PREV" >> "$GITHUB_OUTPUT"
        echo "api-prev-task-arn=$API_PREV" >> "$GITHUB_OUTPUT"
        echo "Currently running — ui: $UI_PREV"
        echo "Currently running — api: $API_PREV"

        # ws is in play only when the caller supplied an image for it AND the
        # service exists in this environment. describe-services does not fail on
        # a missing service — it returns an empty services[] which the query
        # renders as "None" — so that is checked explicitly rather than trusted.
        WS_SERVICE="${{ steps.names.outputs.ws-service }}"
        WS_ENABLED=false
        if [ -z "${{ inputs.ws-image-uri }}" ]; then
          echo "::notice::No ws-image-uri supplied — rolling ui and api only."
        else
          WS_PREV=$(aws ecs describe-services --cluster "$CLUSTER" \
            --services "$WS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          if [ -z "$WS_PREV" ] || [ "$WS_PREV" = "None" ]; then
            echo "::warning::ws-image-uri was supplied but ECS service '$WS_SERVICE' does not exist in cluster '$CLUSTER'. Rolling ui and api only — apply the three-service split in fm-workloads-fls for this environment."
          else
            WS_ENABLED=true
            echo "ws-prev-task-arn=$WS_PREV" >> "$GITHUB_OUTPUT"
            echo "Currently running — ws: $WS_PREV"
          fi
        fi
        echo "ws-enabled=$WS_ENABLED" >> "$GITHUB_OUTPUT"

    - name: Install stability waiter
      # `aws ecs wait services-stable` is capped at 40 attempts x 15s = 10
      # minutes and the CLI exposes no way to raise it, so stability-timeout-minutes
      # could not be honoured with the built-in waiter. This polls the same
      # condition with a caller-supplied deadline, and fails fast on a rollout
      # the circuit breaker has already marked FAILED instead of waiting it out.
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/wait-stable.sh" << 'SCRIPT'
        #!/usr/bin/env bash
        # usage: wait-stable.sh <cluster> <timeout-minutes> <service> [service...]
        set -euo pipefail
        CLUSTER="$1"; shift
        TIMEOUT_MIN="$1"; shift
        DEADLINE=$(( $(date +%s) + TIMEOUT_MIN * 60 ))

        while :; do
          SNAP=$(aws ecs describe-services --cluster "$CLUSTER" --services "$@" \
            --query 'services[].{name:serviceName,deployments:length(deployments),running:runningCount,desired:desiredCount,rollout:deployments[?status==`PRIMARY`]|[0].rolloutState}' \
            --output json)
          REPORT=$(echo "$SNAP" | jq -r '.[] | "  \(.name): deployments=\(.deployments) running=\(.running)/\(.desired) rollout=\(.rollout // "n/a")"')

          if echo "$SNAP" | jq -e 'any(.[]; .rollout == "FAILED")' > /dev/null; then
            echo "::error::ECS reported a FAILED rollout."
            echo "$REPORT"
            exit 1
          fi

          if echo "$SNAP" | jq -e 'all(.[]; .deployments == 1 and .running == .desired)' > /dev/null; then
            echo "$REPORT"
            echo "All services stable."
            exit 0
          fi

          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "::error::Timed out after ${TIMEOUT_MIN}m waiting for services to stabilize."
            echo "$REPORT"
            exit 1
          fi

          echo "$REPORT"
          sleep 15
        done
        SCRIPT
        chmod +x "$RUNNER_TEMP/wait-stable.sh"

    - name: Register new task revision and deploy
      id: deploy
      run: |
        set -euo pipefail
        UI_SERVICE="${{ steps.names.outputs.ui-service }}"
        API_SERVICE="${{ steps.names.outputs.api-service }}"
        WS_SERVICE="${{ steps.names.outputs.ws-service }}"
        WS_ENABLED="${{ steps.current.outputs.ws-enabled }}"
        CLUSTER="${{ vars.ECS_CLUSTER }}"

        # -- GitHub-managed env vars (replace semantics) ---------------------
        # GitHub Environment APP_* vars/secrets are the source of truth for
        # app config (see "Build container env" step). The task definition's
        # environment is REPLACED each deploy: only the infra-provided vars
        # in KEEP_VARS survive from the previous revision, then the GitHub
        # set is appended (GitHub wins any name collision). Removing a var
        # in GitHub therefore removes it from the container on the next
        # deploy - no ratchet.
        EXTRA_ENV=$(cat app-env.json)
        # DB_IAM_AUTH and DB_USER are Terraform-owned (they select IAM-token auth
        # and the Postgres role to authenticate as) and are NOT set in GitHub, so
        # without them on the keep-list this replace strips them on the next
        # deploy — silently reverting the services to password auth as dbadmin.
        # That is not hypothetical: it happened on 2026-08-31 (run 33387090483,
        # a deploy from freeman-dev), which took dev off IAM auth without any
        # visible failure.
        #
        # SERVICE_ROLE is the same case. It selects which slice of the HTTP
        # surface a container serves (static | api-user | api-ws) and is set
        # per SERVICE by Terraform, so it cannot move to GitHub: Environment
        # config is per environment, but the three services in one environment
        # each need a different value. Off the keep-list, this replace strips
        # it and every container falls back to serving all three roles — the
        # split silently stops enforcing anything, and because all roles are
        # enabled every health check still returns 200, so the deploy goes
        # green with no signal that it happened.
        KEEP_VARS='["PORT","NODE_ENV","DB_HOST","DB_PORT","DB_NAME","DATABASE_URL","DB_IAM_AUTH","DB_USER","SERVICE_ROLE"]'

        # ── UI ──────────────────────────────────────────────────────────────
        echo "Describing latest revision of task family '$UI_SERVICE'..."
        aws ecs describe-task-definition --task-definition "$UI_SERVICE" \
          --query 'taskDefinition' --output json > ui-taskdef.json

        # Guard: this single-container topology assumes exactly one container
        # definition. If a sidecar is ever added, fail fast rather than silently
        # rewriting the wrong image — switch to targeting by container name then.
        UI_CONTAINERS=$(jq '.containerDefinitions | length' ui-taskdef.json)
        if [ "$UI_CONTAINERS" -ne 1 ]; then
          echo "::error::UI task definition '$UI_SERVICE' has $UI_CONTAINERS container definitions; expected exactly 1. Refusing to guess which to update."
          exit 1
        fi

        echo "Swapping UI image to ${{ inputs.ui-image-uri }}..."
        # Env replace: keep-list survivors first, GitHub set second;
        # map(last) makes the GitHub entry win any name collision.
        jq --arg img "${{ inputs.ui-image-uri }}" --argjson extra "$EXTRA_ENV" --argjson keep "$KEEP_VARS" '
          .containerDefinitions[0].image = $img |
          .containerDefinitions[0].environment =
            ((((.containerDefinitions[0].environment // [])
               | map(select(.name as $n | $keep | index($n)))) + $extra)
             | group_by(.name) | map(last)) |
          del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
              .compatibilities, .registeredAt, .registeredBy,
              .enableFaultInjection, .deregisteredAt)
        ' ui-taskdef.json > ui-taskdef-new.json

        UI_NEW_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://ui-taskdef-new.json \
          --query 'taskDefinition.taskDefinitionArn' --output text)
        echo "ui-task-arn=$UI_NEW_ARN" >> "$GITHUB_OUTPUT"
        echo "Registered UI revision: $UI_NEW_ARN"

        echo "Updating service '$UI_SERVICE' to use new revision..."
        aws ecs update-service \
          --cluster "$CLUSTER" \
          --service "$UI_SERVICE" \
          --task-definition "$UI_NEW_ARN" \
          --force-new-deployment > /dev/null
        # Marker for the rollback step. Written immediately after the service
        # actually changed, so a failure earlier than this leaves it unset and
        # nothing is rolled back needlessly.
        echo "ui-updated=true" >> "$GITHUB_OUTPUT"

        # ── API ─────────────────────────────────────────────────────────────
        echo "Describing latest revision of task family '$API_SERVICE'..."
        aws ecs describe-task-definition --task-definition "$API_SERVICE" \
          --query 'taskDefinition' --output json > api-taskdef.json

        # Guard: same single-container assumption as the UI task (see above).
        API_CONTAINERS=$(jq '.containerDefinitions | length' api-taskdef.json)
        if [ "$API_CONTAINERS" -ne 1 ]; then
          echo "::error::API task definition '$API_SERVICE' has $API_CONTAINERS container definitions; expected exactly 1. Refusing to guess which to update."
          exit 1
        fi

        echo "Swapping API image to ${{ inputs.api-image-uri }}..."
        # Same env replace as the UI task above (GitHub wins collisions).
        jq --arg img "${{ inputs.api-image-uri }}" --argjson extra "$EXTRA_ENV" --argjson keep "$KEEP_VARS" '
          .containerDefinitions[0].image = $img |
          .containerDefinitions[0].environment =
            ((((.containerDefinitions[0].environment // [])
               | map(select(.name as $n | $keep | index($n)))) + $extra)
             | group_by(.name) | map(last)) |
          del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
              .compatibilities, .registeredAt, .registeredBy,
              .enableFaultInjection, .deregisteredAt)
        ' api-taskdef.json > api-taskdef-new.json

        API_NEW_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://api-taskdef-new.json \
          --query 'taskDefinition.taskDefinitionArn' --output text)
        echo "api-task-arn=$API_NEW_ARN" >> "$GITHUB_OUTPUT"
        echo "Registered API revision: $API_NEW_ARN"

        echo "Updating service '$API_SERVICE' to use new revision..."
        aws ecs update-service \
          --cluster "$CLUSTER" \
          --service "$API_SERVICE" \
          --task-definition "$API_NEW_ARN" \
          --force-new-deployment > /dev/null
        echo "api-updated=true" >> "$GITHUB_OUTPUT"

        # ── WS ──────────────────────────────────────────────────────────────
        # Skipped entirely where the service does not exist (see the capture
        # step); ui and api are unaffected by its absence.
        SERVICES=("$UI_SERVICE" "$API_SERVICE")
        if [ "$WS_ENABLED" = "true" ]; then
          echo "Describing latest revision of task family '$WS_SERVICE'..."
          aws ecs describe-task-definition --task-definition "$WS_SERVICE" \
            --query 'taskDefinition' --output json > ws-taskdef.json

          # Guard: same single-container assumption as the UI task (see above).
          WS_CONTAINERS=$(jq '.containerDefinitions | length' ws-taskdef.json)
          if [ "$WS_CONTAINERS" -ne 1 ]; then
            echo "::error::WS task definition '$WS_SERVICE' has $WS_CONTAINERS container definitions; expected exactly 1. Refusing to guess which to update."
            exit 1
          fi

          echo "Swapping WS image to ${{ inputs.ws-image-uri }}..."
          # Same env replace as the UI task above (GitHub wins collisions).
          jq --arg img "${{ inputs.ws-image-uri }}" --argjson extra "$EXTRA_ENV" --argjson keep "$KEEP_VARS" '
            .containerDefinitions[0].image = $img |
            .containerDefinitions[0].environment =
              ((((.containerDefinitions[0].environment // [])
                 | map(select(.name as $n | $keep | index($n)))) + $extra)
               | group_by(.name) | map(last)) |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy,
                .enableFaultInjection, .deregisteredAt)
          ' ws-taskdef.json > ws-taskdef-new.json

          WS_NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://ws-taskdef-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "ws-task-arn=$WS_NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered WS revision: $WS_NEW_ARN"

          echo "Updating service '$WS_SERVICE' to use new revision..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$WS_SERVICE" \
            --task-definition "$WS_NEW_ARN" \
            --force-new-deployment > /dev/null
          echo "ws-updated=true" >> "$GITHUB_OUTPUT"
          SERVICES+=("$WS_SERVICE")
        else
          echo "Skipping ws — not enabled for this environment."
        fi

        # ── Wait for the rolled services to stabilize ───────────────────────
        echo "Waiting up to ${{ inputs.stability-timeout-minutes }}m for services to stabilize..."
        "$RUNNER_TEMP/wait-stable.sh" "$CLUSTER" "${{ inputs.stability-timeout-minutes }}" \
          "${SERVICES[@]}"
        echo "Deploy complete."

    - name: Roll back on failure
      if: failure() && inputs.rollback-on-failure
      # Only services that were actually switched are rolled back; the job still
      # fails afterwards, because rolling back is damage control, not success.
      run: |
        set -euo pipefail
        CLUSTER="${{ vars.ECS_CLUSTER }}"
        UI_SERVICE="${{ steps.names.outputs.ui-service }}"
        API_SERVICE="${{ steps.names.outputs.api-service }}"
        WS_SERVICE="${{ steps.names.outputs.ws-service }}"

        ROLLED=()
        if [ "${{ steps.deploy.outputs.ui-updated }}" = "true" ]; then
          echo "Rolling '$UI_SERVICE' back to ${{ steps.current.outputs.ui-prev-task-arn }}..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$UI_SERVICE" \
            --task-definition "${{ steps.current.outputs.ui-prev-task-arn }}" \
            --force-new-deployment > /dev/null
          ROLLED+=("$UI_SERVICE")
        fi

        if [ "${{ steps.deploy.outputs.api-updated }}" = "true" ]; then
          echo "Rolling '$API_SERVICE' back to ${{ steps.current.outputs.api-prev-task-arn }}..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$API_SERVICE" \
            --task-definition "${{ steps.current.outputs.api-prev-task-arn }}" \
            --force-new-deployment > /dev/null
          ROLLED+=("$API_SERVICE")
        fi

        if [ "${{ steps.deploy.outputs.ws-updated }}" = "true" ]; then
          echo "Rolling '$WS_SERVICE' back to ${{ steps.current.outputs.ws-prev-task-arn }}..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$WS_SERVICE" \
            --task-definition "${{ steps.current.outputs.ws-prev-task-arn }}" \
            --force-new-deployment > /dev/null
          ROLLED+=("$WS_SERVICE")
        fi

        if [ ${#ROLLED[@]} -eq 0 ]; then
          echo "Failure happened before any service was updated; nothing to roll back."
          exit 0
        fi

        echo "Waiting for rolled-back services to stabilize..."
        "$RUNNER_TEMP/wait-stable.sh" "$CLUSTER" "${{ inputs.stability-timeout-minutes }}" "${ROLLED[@]}"
        echo "::warning::Rolled ${ROLLED[*]} back to the previous task revision."

    - name: Deployment summary
      if: always()
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" << EOF
        ## Deployment to ${{ inputs.environment }}
        - **Cluster:** ${{ vars.ECS_CLUSTER }}
        - **URL:** ${{ vars.ENVIRONMENT_URL }}

        ### UI
        - **Service:** ${{ steps.names.outputs.ui-service }}
        - **Image:** \`${{ inputs.ui-image-uri }}\`
        - **Task revision:** ${{ steps.deploy.outputs.ui-task-arn }}

        ### API
        - **Service:** ${{ steps.names.outputs.api-service }}
        - **Image:** \`${{ inputs.api-image-uri }}\`
        - **Task revision:** ${{ steps.deploy.outputs.api-task-arn }}

        ### WS
        - **Enabled:** ${{ steps.current.outputs.ws-enabled }}
        - **Service:** ${{ steps.names.outputs.ws-service }}
        - **Image:** \`${{ inputs.ws-image-uri }}\`
        - **Task revision:** ${{ steps.deploy.outputs.ws-task-arn }}
        EOF
